[package]
name = "apex-pro-mini-gg-rgb"
version = "0.1.0"
edition = "2021"
description = "Experimental wired Apex Pro Mini RGB protocol and guarded Linux HID diagnostic"
license = "MIT"
repository = "https://github.com/newnetmp3/ApexProMini_gg_rgb"

[lib]
name = "apex_pro_mini"
path = "src/lib.rs"

[[bin]]
name = "apex-mini-rgb"
path = "src/main.rs"

[features]
default = []
gui = ["dep:eframe"]

[dependencies]
eframe = { version = "=0.31.1", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[[bin]]
name = "apex-mini-gui"
path = "src/gui.rs"
required-features = ["gui"]
