name: Rust protocol checks

on:
  push:
  pull_request:

jobs:
  cargo:
    name: Rust unit tests and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build and run unit tests (no devices)
        run: cargo test --all-targets --locked
      - name: Static lint
        run: cargo clippy --all-targets --locked -- -D warnings
